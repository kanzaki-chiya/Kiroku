<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FB3FF"/><stop offset="1" stop-color="#2A6FE8"/>
    </linearGradient>
    <radialGradient id="glow" cx="260" cy="200" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="-280" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD66B"/><stop offset="1" stop-color="#FFA25C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="500" x2="0" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE066"/><stop offset="1" stop-color="#FFB020"/>
    </linearGradient>
    <clipPath id="icon"><rect width="1024" height="1024" rx="228"/></clipPath>
    <clipPath id="coverClip"><rect x="-182" y="-252" width="364" height="370" rx="28"/></clipPath>
    <clipPath id="starClip"><path d="M700.00,500.00 L754.08,625.57 L890.21,638.20 L787.50,728.43 L817.56,861.80 L700.00,792.00 L582.44,861.80 L612.50,728.43 L509.79,638.20 L645.92,625.57 Z"/></clipPath>
    <filter id="shadowSm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A1432" flood-opacity="0.22"/>
    </filter>
    <filter id="shadowLg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#0A1432" flood-opacity="0.28"/>
    </filter>
    <filter id="shadowStar" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A1432" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g clip-path="url(#icon)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <g transform="translate(512 512) scale(1.06) translate(-542 -518)">
      <!-- 收藏：身后两张卡 -->
      <g filter="url(#shadowSm)">
        <rect x="-200" y="-270" width="400" height="540" rx="44" fill="#9ED6FF" transform="translate(430 470) rotate(-16)"/>
      </g>
      <g filter="url(#shadowSm)">
        <rect x="-200" y="-270" width="400" height="540" rx="44" fill="#CBE9FF" transform="translate(560 470) rotate(12)"/>
      </g>

      <!-- 正面封面卡 -->
      <g filter="url(#shadowLg)">
        <rect x="-210" y="-280" width="420" height="560" rx="48" fill="#FFFFFF" transform="translate(500 500) rotate(-3)"/>
      </g>
      <g transform="translate(500 500) rotate(-3)">
        <g clip-path="url(#coverClip)">
          <rect x="-210" y="-280" width="420" height="560" fill="url(#cover)"/>
          <circle cx="-60" cy="-130" r="58" fill="#FFF6D6"/>
          <path d="M-210 118 L-210 40 Q-80 -60 40 40 Q120 -10 210 20 L210 118 Z" fill="#2A6FE8"/>
        </g>
        <!-- 追番进度 -->
        <rect x="-182" y="168" width="214" height="30" rx="15" fill="#E3EEFB"/>
        <rect x="-182" y="168" width="132.68" height="30" rx="15" fill="#2A6FE8"/>
        <rect x="-182" y="224" width="154.08" height="22" rx="11" fill="#E3EEFB"/>
      </g>

      <!-- 评分：星星 -->
      <path d="M700.00,500.00 L754.08,625.57 L890.21,638.20 L787.50,728.43 L817.56,861.80 L700.00,792.00 L582.44,861.80 L612.50,728.43 L509.79,638.20 L645.92,625.57 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="44" stroke-linejoin="round" filter="url(#shadowStar)"/>
      <path d="M700.00,500.00 L754.08,625.57 L890.21,638.20 L787.50,728.43 L817.56,861.80 L700.00,792.00 L582.44,861.80 L612.50,728.43 L509.79,638.20 L645.92,625.57 Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
      <g clip-path="url(#starClip)">
        <ellipse cx="640" cy="610" rx="90" ry="40" transform="rotate(-28.65 640 610)" fill="#FFFFFF" fill-opacity="0.35"/>
      </g>
    </g>
  </g>
</svg>
